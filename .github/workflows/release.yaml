name: release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

env:
  DOCKER_BUILDX_PLATFORMS: linux/amd64,linux/arm64

jobs:
  release:
    permissions:
      contents: 'read'
      id-token: "write"
    runs-on: ubuntu-latest
    name: release
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout local
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - id: buildx-setup
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          platforms: ${{ env.DOCKER_BUILDX_PLATFORMS }}

      - name: Fetch git tag
        id: git-tag
        shell: bash
        run: |
          set -x
          tag=$(git describe --tags --exact --match '[0-9]*.[0-9]*.[0-9]*')
          echo "release-version=$tag" >> $GITHUB_OUTPUT

      - name: Build images
        run: |
          make build-extension TAG=${{ steps.git-tag.outputs.release-version }}

      - name: "Docker Login"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Push images
        run: |
          make push-extension TAG=${{ steps.git-tag.outputs.release-version }}
